server:
  port: ${CARBON_SERVER_PORT:8082}

spring:
  profiles:
    group:
      # 激活 local profile 时同时激活 job profile（本地测试 Web 容器 + 定时任务同时运行）
      # 注意：spring.profiles.include 不能放在 profile 专属文件（application-local.yml）中，
      # 因此统一在主配置文件用 profile group 实现
      local: job
  datasource:
    url: ${CARBON_DB_URL:jdbc:mysql://localhost:3306/carbon_emissions?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci}
    username: ${CARBON_DB_USERNAME:root}
    password: ${CARBON_DB_PASSWORD:1275410782h}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: ${CARBON_SQL_INIT_MODE:never}

logging:
  level:
    com.example.carbon.emission.model: INFO
  file:
    name: logs/carbon-emission.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

integration:
  ruoyi-security:
    enabled: ${RUOYI_SECURITY_ENABLED:true}
    endpoint: ${RUOYI_SECURITY_ENDPOINT:http://127.0.0.1:8081/internal/security/context}
  ruoyi-audit:
    enabled: ${RUOYI_AUDIT_ENABLED:true}
    endpoint: ${RUOYI_AUDIT_ENDPOINT:http://127.0.0.1:8081/internal/carbon/audit/operation}
    secret: ${GOVIEW_AUDIT_SECRET:local-integration-secret}

carbon:
  statistics:
    demo:
      enabled: ${CARBON_STATISTICS_DEMO_ENABLED:true}
    monthly-repair:
      enabled: ${CARBON_MONTHLY_REPAIR_ENABLED:false}
      cron: ${CARBON_MONTHLY_REPAIR_CRON:0 0 2 * * *}
    prediction-send:
      base-url: ${CARBON_MONTHLY_PREDICTION_URL:}
      api-key: ${CARBON_MONTHLY_PREDICTION_API_KEY:}
      jlg-traction-categories: ${CARBON_MONTHLY_JLG_TRACTION_CATEGORIES:}
      jlg-auxiliary-categories: ${CARBON_MONTHLY_JLG_AUXILIARY_CATEGORIES:}
