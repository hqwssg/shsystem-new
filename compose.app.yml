services:
  sh-app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    restart: unless-stopped
    environment:
      CERDB_JDBC_DRIVER: ${CERDB_JDBC_DRIVER}
      CERDB_JDBC_URL: ${CERDB_JDBC_URL}
      CERDB_APP_USER: ${CERDB_APP_USER}
      CERDB_APP_PASSWORD: ${CERDB_APP_PASSWORD}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL}
      PYTHON_INTERNAL_TOKEN: ${PYTHON_INTERNAL_TOKEN}
      PYTHON_SERVICE_REQUIRED: "true"
      PREDICTION_BASE_URL: ${PREDICTION_BASE_URL:?Set PREDICTION_BASE_URL}
      PREDICTION_API_KEY: ${PREDICTION_API_KEY:?Set PREDICTION_API_KEY}
    ports: ["${WEB_PORT:-80}:80"]
    volumes: ["${SHARED_DATA_HOST_PATH:?Set SHARED_DATA_HOST_PATH}:/srv/shared"]
