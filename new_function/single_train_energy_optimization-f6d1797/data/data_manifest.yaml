single_train:

  - name: train_parameters
    path: "data/single_train/train_parameters.json"
    source: "本项目维护；整备质量与机车曲线由 shared 导出，阻力系数为 assumed"
    status: derived
    unit: "SI（kg / m / s / N / ‰）"
    version: "v2.0"
    last_updated: "2026-11-05"
    notes: >
      v2.0（2026-11-05 共享数据同步）：整备质量由 21600 t 改为 21900 t —— trains.csv 的
      mass_tons 语义固定为**车辆总重**（216 辆 × 100 t，经智能电表 5869 趟核对，不含机车），
      机车按 1 台 × 神华号 12 轴 300 t 另加；装配时由 consist_mass_kg() 从共享数据重算并校验镜像值，
      幂等标记 vehicle_mass_kg 保证重复叠加不会重复加。同时新增 locomotive_type / locomotive_count /
      electrical_level 三个口径字段：max_regen_force_n 由 6200 kN（全列制动总量，误用）改为单台曲线峰值
      691.5 kN，按台数与投入级位 0.48 折算到全列——旧口径把可回收电量高估约一个数量级。
      assumed 字段：basic_resistance、regen_fraction_cap；max_brake_force_n 取自 trains.csv 的
      max_brake_kN = 6200 kN（全列空气 + 电制动总量，只约束总制动力，不作再生能力）。

  - name: motor_parameters
    path: "data/single_train/motor_parameters.json"
    source: "本项目维护；功率上限由 shared trains.csv 导出，其余为 placeholder/assumed"
    status: placeholder
    unit: "SI（W / N / m/s / V）"
    version: "v2.0"
    last_updated: "2026-11-05"
    notes: "v2.0（2026-11-05）：max_regen_power_w 28800 kW → 14400 kW（trains.csv 的 max_power_kW 是**单机**持续功率，× 台数得全列上限）；max_regen_force_n 6200 kN → 691.5 kN（单台机车曲线峰值，装配时按台数折算）。功率上限的唯一来源是共享数据，本文件只是镜像，装配时不一致直接报错。无实测牵引/制动特性曲线。dc_link_voltage_window 为纯占位。v1.1（问题 26）：regen_efficiency.peak_load_ratio 由 0.75 改为 1.0——该字段此前被声明并被读取却从未进入 efficiency() 公式（死参数），修复后负载率归一化到峰值负载点，取 1.0 时曲线与历史文档口径逐位一致（交付能量数字零影响）；待实测效率云图到位后按云图峰值点回填。"

  - name: dc_dc_parameters
    path: "data/single_train/dc_dc_parameters.json"
    source: "本项目维护；duty_limit 来自技术方案（official），其余为 placeholder/assumed"
    status: placeholder
    unit: "SI（H / F / Ω / Hz / W / V）"
    version: "v1.3"
    last_updated: "2026-11-05"
    notes: >
      电感/电容/开关频率均为占位值，未经任何硬件资料确认。duty_limit.u0_max=0.9 来自技术方案 4.2.1.3。
      **新依赖（2026-09-25，随问题 18 落地引入）**：闭环的『控制通道增益先验』
      B_target = [[(1-d2)·v_in·dt²/(2·L·C_out), −i_L·dt/C_out], [v_in·dt/L, v_out·dt/L]]
      由本文件的 inductance_h 与 output_capacitance_f 解析给出，即**控制增益现在挂在两个占位值上**
      （此前 B 由 EKF/UKF 从数据学出，不直接依赖硬件参数）。开关频率不进入 B_target。
      实测（族 7，dt=4e-4，tools/probe_gain_prior_placeholder_sensitivity.py）：结构稳健
      （B_target 按解析式精确缩放，闭环全部留在物理包络内，先验残差恒定 2.16e-16）；
      但回收能量对占位值敏感（C_out×0.5 → +62.0%，L×2.0 → +29.8%），
      故『回收能量』的具体数字在硬件资料到位前不可作为工程结论。
      已固化为回归测试（tests/test_control_channel.py 缩放律 + tests/test_validation.py 包络）。
      **消费状态变更（2026-09-26，随问题 32 落地）**：本文件的 power_rating_w（v2.0 起为 14400000.0 W，
      由 shared trains.csv 的 max_power_kW × 机车台数导出；旧值 28800 kW 是「2 台 × 14.4 MW」的口径）
      （field_data_status = assumed）此前**被读入却全仓无消费点**——只在 DCConverterParameters.__post_init__
      被校验为正数、在 from_parameters 被读出，没有任何计算使用它，导致『变流器是否越额定功率』
      在代码里无法判定。现已补三层消费点：① 判定 DCConverterStepResult.power_limited_by_rating
      （修复前该标志误用 max_input_current_a，与 input_current_over_limit 逐位相同）；
      ② 统计 run() 备注『越额定拍数 = k / n（只报告不截断）』；
      ③ 指标 converter_over_rating_ratio（越限拍占比，经 build_scenario_metrics(extra_ratios=…)
      并入 ScenarioMetrics.extra），并由 SimulationResult.converter_limits 透传限值。
      实测（官方套件配置 dt=2e-4，逐步记录 record_stride=1，tools/probe_converter_rating_audit.py --full）：
      v2.0 口径下重测（dt=2e-4、record_stride=1、主算法）：max|p_in| = 2.303 MW = 额定的 15.99%
      （s1_flat_braking / s4_power_step）、s2_long_downhill 1.041 MW（7.23%）；max|i_src| = 1535.5 A
      = max_input_current_a（当时 24000 A）的 6.40%。**全部官方场景的越额定拍 / 越限拍都是 0**。
      ⚠️ power_rating_w 为 assumed（由共享单机持续功率导出），硬件资料到位后需替换。
      v1.3（2026-11-05）：max_input_current_a 由 24000 A（28.8 MW 口径遗留，1500 V 下等于 36 MW）
      改为 9600 A = 14.4 MW ÷ 1500 V，等级 assumed → derived；同时补齐
      input_capacitance_f / output_capacitance_f / dc_bus_source / input_voltage_window /
      output_voltage_window / inductor_resistance_ohm 等 13 个此前**没有等级标签**的字段，
      依赖登记键由匹配不到任何字段的组键 capacitance_f 改为真实字段名 output_capacitance_f
      （B_target 只用 C_out，母线侧 C_in 不进入解析式）。改后 dt=1e-4 全基线实测
      max|i_src| = 3388 A（35% 限值）、max|p_in| = 5.12 MW（额定 35.6%），越限仍为 0，能量读数逐位不变。

  - name: storage_parameters
    path: "data/single_train/storage_parameters.json"
    source: "由 shared/battery.json 派生 + 工程预设"
    status: derived
    unit: "SI（J / W / V / Ω）"
    version: "v1.3"
    last_updated: "2026-11-05"
    notes: >
      capacity/RTE/max_charge 为 real；max_discharge 采用规划假设值（原文件 missing_conservative_zero）；
      soc_min/soc_max 与 nominal_voltage 为 assumed/placeholder。
      **新依赖（2026-09-25，随问题 21 落地引入）**：闭环参考量 x_ref 的电压分量由
      「窗口内就地保持」改为「储能吸收匹配」：
      P_abs = min(P_req, P_avail, P_conv, max_charge_power_w)；
      v_ref = clip((V_oc + sqrt(V_oc² + 4·P_abs·R_int))/2, V_out,min, V_out,max)。
      即**闭环控制律现在挂在储能侧的三个参数上**（此前本文件只被被控对象使用，
      不被控制器使用）：max_charge_power_w（real，硬上限）、
      nominal_voltage_v 与 internal_resistance_ohm（均 placeholder）。
      实测（s1/s2，dt=2e-4，全分辨率，tools/probe_reference_voltage_placeholder_sensitivity.py）：
      结构稳健（无论 V_oc/R_int/max_charge_power_w 如何按 0.5×/2.0× 缩放，
      稳态恒满足 (1−d2)·i_L = i_sink 且 d2 → 0（中位数 ≤ 0.112），
      v_out 峰值留在窗口内（≤ 1240.5 V < 1500 V））；但回收能量对占位值与功率上限敏感。
      注意：i_L 的**水平**由可吸收功率决定，其峰值随 max_charge_power_w 缩放而变是
      **正确行为而非缺陷**，故不作为结构判据。
      故『回收能量』的具体数字在储能电气资料到位前不可作为工程结论。
      已固化为回归测试（tests/test_validation.py 参考量包络 + 敏感度）。
      **消费状态变更（2026-09-26，随问题 33 落地）**：max_charge_power_w 由「只被控制器与被控对象
      读取」扩展为「由仿真器逐步记录成参考量列」——SimulationArrays.reference_power_w =
      RegenerativeReferenceState.absorbable_power(observation)，供 tracking_* 指标组作**参考功率**。
      修复前该指标组的参考量取的是 regen_wheel_power_w（**轮端**可用再生功率），与实测量
      accepted_power_w（**储能侧**接受功率）跨了整条变换链，官方 s1 实测 28.8 MW vs 2.0 MW、
      缺口 14.4×，使 tracking_rmse 对全部控制器都是 19.30~20.52 MW（回收 0.000 kWh 的
      uncontrolled_zero_duty 只比主算法差 5.9%）、overshoot 恒 0、settling_time 恒 None。
      同时把 max_charge_power_w 的校验由「严格为正」放宽为「>= 0」：None 表示『未给定上限』，
      0.0 表示『上限就是 0』——后者是 validation/perturbation.py::disable_storage 造的
      「无储能」被控对象（基线 no_storage_zero_duty），语义上 P_abs=0 ⟹ i_L,ref=0、
      v_out,ref=V_oc，正是「仅回网」的稳态。本文件的数值本身**未改动**。
      本条修复只改报告通道，交付数字零影响。详见 docs/regenerative_braking_algorithm.md §5.17。
      v1.3（2026-11-05）：补登两个此前没有等级标签的字段——capacity_j（derived，= capacity_kwh × 3.6e6）
      与 soc_initial（assumed，0.5）；**数值未改动**，只补溯源。登记表见 docs/virtual_data_register_2026-11-05.md。

