contested_assumptions:
  - id: two_wan_ton_locomotive_count
    title: "两万吨列车机车台数与编组（12 轴 + 8 轴）"
    status: settled
    value: 2
    unit: "台"
    resolved_at: "2026-11-07"
    mirror_of: "heavy_empty_train_coordination/data/real_shuohuang/assumptions.json#two_wan_ton_locomotive_count"
    basis: >
      三条相互独立的证据指向「1+1 两台」：
      ① 甲方《2025朔黄铁路编组模式》：「两万吨 重车 编组模式 1+1（交+交）辆数 216」，
      「1+1」「交+交」均指两台交流机车；
      ② 《列车运行图及技术资料》第 7 页：「2 万吨列车由国能号 12 轴 + 国能号 8 轴交流机车固定担当」；
      ③ 能量守恒独立校核（`tools/audit_energy_closure.py`）：单机口径下轮周牵引 6,322 kWh
      低于 m·g·U − ½mv² 的物理下界 9,884 kWh（−36%），只有「双机、电表读数只是其中一台」
      一种读法可满足该下界（+26.2%）。
    conflict: >
      电表台账每趟只有 3 块表（a/b/c），三者之和恒等于 use_ygdn，看起来"只有一台车"。
      但 `250917-2001号车…xls` 证明这是「一台车 A/B/C 三节」的记账口径：三块表是本务机车
      （12 轴 = 3 节）的三节，补机（8 轴 = 2 节）不在本表内。此前两次判定（先 1 台、后 3 台）
      都只在"表数"这一个维度上推台数，方向都错。因此本条从 contested 改为 settled。
    alternatives:
      - value: 1
        label: "单台 12 轴（曾判定，已撤回）"
        implication: >
          整备 21,900 t、功率 14,400 kW、电制动峰值 691.5 kN。
          该口径下牵引电量低于物理下界 36%，物理上不成立，不再作为对外口径。
    impact_in_this_project:
      - "整备质量：21,900 t → 22,100 t（12 轴 300 t + 8 轴 200 t，逐型求和）"
      - "功率上限：14,400 kW → 24,000 kW（逐型 continuous_power_kW 求和，不是首型 × 2）"
      - "电制动力上限：691.5 kN → 1,152.5 kN（两条曲线按并集速度栅格逐点求和）"
      - "式(72) 交叉校核：SHENHUA_8 无 I_z 表，Q_z 降级为**下限**（只含 12 轴电流）"
      - "全部历史读数作废（质量 +0.9%、功率 +67%、电制动峰值 +67%）"
    project_default: "1+1 两台（SHENHUA_12:1|SHENHUA_8:1，整备 22,100 t）"
    switch_how: >
      编组以 `trains.csv:locomotive_consist` 为准（权威表示）；
