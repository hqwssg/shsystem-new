    path: "shared/trains.csv"
    source: "PDF 编组资料 + 工程虚拟预设"
    status: mixed
    unit: "t / kN / - / km"
    version: "real_shuohuang@2026-11-04（v2.0）"
    last_updated: "2026-11-04"
    notes: >
      仅 2 行（Heavy / Empty）。mass_tons 来自真实编组资料（real）；
      max_traction_kN / max_brake_kN / davis_a,b,c / max_power_kW 文件自述为工程虚拟预设（assumed）。
      重要：davis 系数基准已查明（2026-09-25，由本项目读
      heavy_empty_train_coordination/train_simulator.py::calculate_forces() 得出，
      属"读代码查明"，尚非重空协同项目的书面确认）：
          rb_kN = (davis_a + davis_b * v[m/s]) * rolling_multiplier
                  + davis_c * v[m/s]^2 * aerodynamic_multiplier
      即「绝对 kN + 速度用 m/s + 二次项作用在 v² + 公式中无质量项」，
      两个环境乘子默认 1.0（无量纲天气因子）。
      这与本项目 basis="per_kN_speed_kmh" 的口径不可直接互换：
          w0[N/kN] = a + b * v[km/h] + c * v[km/h]^2 ;  F0[N] = w0/1000 * m[kg] * g
      量级差异巨大：Heavy 在 72 km/h 下，本项目口径 405.5 kN，重空口径 11.12 kN（相差 36.5 倍）。
      本项目仍不复用该组系数，改用 data/single_train/train_parameters.json 中独立标定的 assumed 值；
      待重空协同项目书面确认基准（尤其是"是否漏了质量项"）后，才考虑改为共享同一组系数。
      详见 docs/data_sharing_boundary.md §4.1。
      v2.0（2026-11-04）：新增 locomotive_type / locomotive_count / freight_load_state 三列，
      mass_note 写明「21600 t = 216 辆 × 100 t，经智能电表 5869 趟核对，不含机车」，
      max_power_kW 定为单机持续功率 14400（乘台数使用）。mass_tons 数值未变（21600 / 4320），
      但语义从「列车总重」收紧为「车辆总重」——整备质量改在装配期叠加机车，
      因此本项目的 22100 t 由 `consist_mass_kg()` 计算，不再回写本文件。
      v2.1（2026-11-07）：新增 `locomotive_consist` 列 = `SHENHUA_12:1|SHENHUA_8:1`，
      是**整列编组的权威表示**（两万吨 = 12 轴 + 8 轴两台，依据见 §四）。
      `locomotive_type` / `locomotive_count` 退化为「首型及其台数」，供未适配 consist 的
      消费方使用；`locomotive_count` 因此**仍是 1**，不是整列台数——填 2 会按
      `2 × 300 t / 2 × 14 400 kW` 算成 600 t / 28 800 kW，全错。

