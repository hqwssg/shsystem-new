user shsystem;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /srv/shared/nginx-error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /srv/shared/nginx-access.log;
  sendfile on;
  client_max_body_size 50m;

  server {
    listen 80;
    server_name _;
    root /opt/shsystem/static/ruoyi-ui;

    location = / { try_files /index.html /50x.html =404; }
    location / { try_files $uri $uri/ /index.html; }
    location = /goview { return 301 /goview/; }
    location /goview/ { root /opt/shsystem/static; try_files $uri $uri/ /goview/index.html; }
    location = /carbon-model { return 301 /carbon-model/; }
    location /carbon-model/ { root /opt/shsystem/static; try_files $uri $uri/ /carbon-model/index.html; }
    location /carbon-screen/internal/ { return 404; }
    location /carbon-screen/ { proxy_pass http://127.0.0.1:8081/; }
    location /carbon/ { proxy_pass http://127.0.0.1:8087; }
    location /oss/ { proxy_pass http://127.0.0.1:8087; }
    location = /prediction { return 301 /prediction/; }
    location /prediction/ { root /opt/shsystem/static; try_files $uri $uri/ /prediction/index.html; }
    location /prediction-api/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://127.0.0.1:8086/api/;
    }
    location /api/goview/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://127.0.0.1:8087;
    }
    location ^~ /api/uncertainty/ { proxy_pass http://127.0.0.1:8085; }
    location /api/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://127.0.0.1:8082/api/;
    }
    location /uncertainty/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://127.0.0.1:8085/;
    }
    location /prod-api/internal/ { return 404; }
    location /prod-api/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://127.0.0.1:8081/;
    }
    location = /actuator/health {
      proxy_pass http://127.0.0.1:8081/actuator/health;
    }
    location = /prediction-actuator/health {
      proxy_pass http://127.0.0.1:8086/actuator/health;
    }
    location /actuator/ { return 404; }
  }
}
